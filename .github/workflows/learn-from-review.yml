name: Learn from PR Review

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  learn:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect Copilot review comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${REPO}/pulls/${PR_NUM}/comments" \
            --jq '[.[] | select(.user.login | test("copilot|github-actions")) | {body: .body, path: .path, line: .line}]' \
            > /tmp/review-comments.json

          COMMENT_COUNT=$(jq 'length' /tmp/review-comments.json)
          echo "comment_count=$COMMENT_COUNT" >> "$GITHUB_ENV"
          echo "Copilot 리뷰 댓글: ${COMMENT_COUNT}개"

      - name: Skip if no review comments
        if: env.comment_count == '0'
        run: echo "리뷰 댓글이 없습니다. 스킵합니다."

      - name: Collect comments to markdown
        if: env.comment_count != '0'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          chmod +x .github/scripts/extract-review-rules.sh
          bash .github/scripts/extract-review-rules.sh /tmp/review-comments.json

      - name: Create review candidates PR
        if: env.comment_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          BRANCH_NAME="learn/pr-${PR_NUM}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add .claude/review-candidates.md
          git commit -m "learn: PR #${PR_NUM} 리뷰 댓글 수집"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "learn: PR #${PR_NUM} 리뷰 댓글 수집" \
            --body "## 출처
          PR #${PR_NUM}: ${PR_TITLE}

          ## 다음 단계
          1. 이 PR을 체크아웃
          2. \`/review-learnings ${PR_NUM}\` 스킬 실행 → 댓글 분석 + 규칙 추상화 + 적절성 판단
          3. 결과를 확인하고 merge

          > Copilot 리뷰 댓글이 자동 수집되었습니다.
          > 규칙 추상화와 적절성 판단은 Claude Code 스킬로 수행합니다."
