name: Learn from PR Review

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  learn:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect Copilot review comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${REPO}/pulls/${PR_NUM}/comments" \
            --jq '[.[] | select(.user.login | test("copilot|github-actions")) | {body: .body, path: .path, line: .line}]' \
            > /tmp/review-comments.json

          COMMENT_COUNT=$(jq 'length' /tmp/review-comments.json)
          echo "comment_count=$COMMENT_COUNT" >> "$GITHUB_ENV"
          echo "Copilot 리뷰 댓글: ${COMMENT_COUNT}개"

      - name: Skip if no review comments
        if: env.comment_count == '0'
        run: echo "리뷰 댓글이 없습니다. 스킵합니다."

      - name: Extract rules
        if: env.comment_count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          chmod +x .github/scripts/extract-review-rules.sh
          bash .github/scripts/extract-review-rules.sh /tmp/review-comments.json

      - name: Create learning PR
        if: env.comment_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # 변경 사항이 없으면 스킵
          if git diff --quiet .claude/review-learnings.md .github/review-rules.md; then
            echo "변경 사항이 없습니다. 스킵합니다."
            exit 0
          fi

          BRANCH_NAME="learn/pr-${PR_NUM}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add .claude/review-learnings.md .github/review-rules.md
          git commit -m "learn: PR #${PR_NUM} 리뷰에서 규칙 추출"
          git push origin "$BRANCH_NAME"

          DIFF_RULES=$(git diff HEAD~1 -- .claude/review-learnings.md | grep '^+- ' | sed 's/^+//' || true)

          gh pr create \
            --title "learn: PR #${PR_NUM} 리뷰 학습" \
            --body "## 출처
          PR #${PR_NUM}: ${PR_TITLE}

          ## 추출된 규칙
          ${DIFF_RULES}

          ## 검증 체크리스트
          - [ ] 규칙이 일반적으로 적용 가능한가? (프로젝트 특화가 아닌지)
          - [ ] 기존 규칙과 중복되지 않는가?
          - [ ] 규칙 표현이 명확한가?

          > 자동 추출된 규칙입니다. 적절한지 확인 후 merge 해주세요."
